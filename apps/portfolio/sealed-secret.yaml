apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: portfolio-secret
  namespace: personal-apps
  labels:
    app: portfolio
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/part-of: personal-website
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # ---------------------------------------------------------------
    # PLACEHOLDER VALUES — You must seal these with kubeseal:
    #
    #   kubectl create secret generic portfolio-secret \
    #     --namespace personal-apps \
    #     --from-literal=MONGODB_URI='<your-mongo-uri>' \
    #     --from-literal=JWT_SECRET='<your-jwt-secret>' \
    #     --from-literal=NODE_ENV=production \
    #     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
    # ---------------------------------------------------------------
    MONGODB_URI: REPLACE_WITH_SEALED_VALUE
    JWT_SECRET: REPLACE_WITH_SEALED_VALUE
    NODE_ENV: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: portfolio-secret
      namespace: personal-apps
      labels:
        app: portfolio
        app.kubernetes.io/name: portfolio
    type: Opaque
