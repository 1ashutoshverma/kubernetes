apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: personal-apps
  labels:
    app: chat-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      containers:
        - name: chat-backend
          image: ghcr.io/1ashutoshverma/chat-app-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: chat-backend-secret
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /api
              port: 8080
            initialDelaySeconds: 5
