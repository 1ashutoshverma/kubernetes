    #   kubectl create secret generic chat-backend-secret \
    #     --namespace personal-apps \
    #     --from-literal=PORT=8080 \
    #     --from-literal=MONGO_DB='<your-mongo-uri>' \
    #     --from-literal=JWT_SECRET='<your-jwt-secret>' \
    #     --from-literal=GOOGLE_CLIENT_ID='<your-google-client-id>' \
    #     --from-literal=GOOGLE_CLIENT_SECRET='<your-google-client-secret>' \
    #     --from-literal=REDIRECTING_URL='https://chat.ashutoshverma.com' \
    #     --from-literal=CAll_BACK='https://chat-api.ashutoshverma.com/user/google/callback' \
    #     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
    # ---------------------------------------------------------------
    PORT: REPLACE_WITH_SEALED_VALUE
    MONGO_DB: REPLACE_WITH_SEALED_VALUE
    JWT_SECRET: REPLACE_WITH_SEALED_VALUE
    GOOGLE_CLIENT_ID: REPLACE_WITH_SEALED_VALUE
    GOOGLE_CLIENT_SECRET: REPLACE_WITH_SEALED_VALUE
    REDIRECTING_URL: REPLACE_WITH_SEALED_VALUE
    CAll_BACK: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: chat-backend-secret
      namespace: personal-apps
      labels:
        app: chat-backend
        app.kubernetes.io/name: chat-backend
    type: Opaque
