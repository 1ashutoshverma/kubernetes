  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/part-of: chat-app
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # ---------------------------------------------------------------
