apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: personal-apps
  labels:
    app: chat-frontend
    app.kubernetes.io/name: chat-frontend
    app.kubernetes.io/part-of: chat-app
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chat-frontend
  template:
    metadata:
      labels:
        app: chat-frontend
        app.kubernetes.io/name: chat-frontend
    spec:
      containers:
        - name: chat-frontend
          image: ghcr.io/1ashutoshverma/chat-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
